name: publish
# Publishes pdata-client to PyPI when a version tag such as v0.1.0 is pushed.
# PyPI's trusted publishing (OpenID Connect) authenticates the upload, so no
# token is stored in this repository. One-time setup on PyPI: a (pending)
# trusted publisher with project pdata-client, owner noskillcoding,
# repository pdata-client, workflow publish.yml and environment pypi.
# Actions are pinned to full commit SHAs (the release tag is in each comment)
# because this workflow can obtain a publishing token.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/pdata/_version.py").read_text()).group(1))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pdata-client
    permissions:
      id-token: write  # trusted publishing; nothing else gets this right
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3 (release/v1)
