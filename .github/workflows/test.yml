name: test
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly live smoke test against api.pdata.world
permissions:
  contents: read
jobs:
  test:
    # ubuntu-latest became 26.04, which has no Python 3.9 build (the weekly run
    # of 2026-11-09 failed on it), so the oldest supported Python runs on 24.04.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
        env:
          PDATA_LIVE: ${{ github.event_name == 'schedule' && '1' || '' }}
